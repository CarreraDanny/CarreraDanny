<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Danny Carrera — Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111c3a"/>
      <stop offset="1" stop-color="#1b1446"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="360" rx="22"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .fade { animation: in 0.9s ease-out backwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.35s; } .d3 { animation-delay: 0.6s; }
      .d4 { animation-delay: 0.85s; } .d5 { animation-delay: 1.1s; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glowA)"/>
    <rect width="1200" height="360" fill="url(#glowB)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Left: identity -->
  <g class="sans">
    <text class="fade d1" x="64" y="122" font-size="62" font-weight="800" fill="#f8fafc" letter-spacing="-1">Danny Carrera</text>
    <rect class="fade d1" x="66" y="142" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text class="fade d2" x="64" y="190" font-size="22" font-weight="600" fill="#cbd5e1">Software Developer · Information Systems Engineer</text>
    <text class="fade d2" x="64" y="222" font-size="18" fill="#94a3b8">Software Development · Cybersecurity · Automation</text>

    <g class="fade d3" transform="translate(64 254)">
      <circle cx="7" cy="9" r="6" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="7" cy="9" r="2" fill="#22d3ee"/>
      <text x="22" y="15" font-size="16" fill="#94a3b8">Pamplona, Spain</text>
    </g>

    <g class="fade d4" font-size="14" font-weight="700" text-anchor="middle">
      <rect x="64"  y="290" width="88"  height="32" rx="16" fill="#1e3a5f" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="108" y="311" fill="#e0f2fe">Python</text>
      <rect x="162" y="290" width="74"  height="32" rx="16" fill="#1e3a5f" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="199" y="311" fill="#e0f2fe">Java</text>
      <rect x="246" y="290" width="112" height="32" rx="16" fill="#2e1f5e" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="302" y="311" fill="#ede9fe">TypeScript</text>
      <rect x="368" y="290" width="96"  height="32" rx="16" fill="#2e1f5e" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="416" y="311" fill="#ede9fe">Angular</text>
      <rect x="474" y="290" width="120" height="32" rx="16" fill="#123b3a" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="534" y="311" fill="#d1fae5">Spring Boot</text>
    </g>
  </g>

  <!-- Right: code card -->
  <g class="fade d5">
    <rect x="676" y="58" width="470" height="244" rx="16" fill="#0a1020" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="704" cy="84" r="6" fill="#f87171"/>
    <circle cx="724" cy="84" r="6" fill="#fbbf24"/>
    <circle cx="744" cy="84" r="6" fill="#34d399"/>
    <text x="1120" y="89" class="mono" font-size="12" fill="#64748b" text-anchor="end">danny.py</text>
    <line x1="676" y1="106" x2="1146" y2="106" stroke="#ffffff" stroke-opacity="0.07"/>

    <g class="mono" font-size="15">
      <text x="704" y="142"><tspan fill="#c084fc">class</tspan><tspan fill="#f8fafc"> Danny</tspan><tspan fill="#94a3b8">:</tspan></text>
      <text x="704" y="174"><tspan fill="#7dd3fc">&#160;&#160;&#160;&#160;role&#160;&#160;&#160;</tspan><tspan fill="#94a3b8">= </tspan><tspan fill="#86efac">"Software Developer"</tspan></text>
      <text x="704" y="202"><tspan fill="#7dd3fc">&#160;&#160;&#160;&#160;builds&#160;</tspan><tspan fill="#94a3b8">= </tspan><tspan fill="#86efac">"software &amp; distributed systems"</tspan></text>
      <text x="704" y="230"><tspan fill="#7dd3fc">&#160;&#160;&#160;&#160;learns&#160;</tspan><tspan fill="#94a3b8">= </tspan><tspan fill="#86efac">"cybersecurity, ML, big data"</tspan></text>
      <text x="704" y="258"><tspan fill="#7dd3fc">&#160;&#160;&#160;&#160;based&#160;&#160;</tspan><tspan fill="#94a3b8">= </tspan><tspan fill="#86efac">"Pamplona, ES"</tspan></text>
      <rect class="cursor" x="704" y="272" width="9" height="17" fill="#22d3ee"/>
    </g>
  </g>
</svg>
